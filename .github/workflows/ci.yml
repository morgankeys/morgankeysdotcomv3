name: CI

on:
  pull_request:
    branches: [main, staging]

# A newer push to the same PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Code

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Code/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run check

      # `npm run build` regenerates design tokens first, so this also catches a
      # token pipeline that no longer builds.
      - run: npm run build

      - run: npm run ds:validate
